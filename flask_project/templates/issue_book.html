{% extends "base.html" %}

{% block title %}Book Issue Form Page - Library Management System{% endblock %}

{% block content %}
<div class="center-container">
    <div class="window-card window-card-md">
        <div class="card-top-bar">
            Book Issue Form Page (issue_book.html)
        </div>
        <div class="card-body">
            <form action="{{ url_for('issue_book') }}" method="POST">
                <div class="form-group">
                    <label for="book_id" class="form-label">BookID</label>
                    <input type="text" id="book_id" name="book_id" class="form-control" placeholder="Enter book ID" required autofocus>
                </div>

                <div class="form-group">
                    <label for="book_name" class="form-label">Book Name</label>
                    <input type="text" id="book_name" name="book_name" class="form-control" placeholder="Enter book name" required>
                </div>

                <div class="form-group">
                    <label for="book_number" class="form-label">Book Number</label>
                    <input type="text" id="book_number" name="book_number" class="form-control" placeholder="Enter book number" required>
                </div>

                <div class="form-group">
                    <label for="student_name" class="form-label">Name of Student</label>
                    <input type="text" id="student_name" name="student_name" class="form-control" placeholder="Enter student name" required>
                </div>

                <div class="form-group">
                    <label for="issue_date" class="form-label">Issue Date</label>
                    <input type="date" id="issue_date" name="issue_date" class="form-control" placeholder="Select issue date" required>
                </div>

                <div class="form-group">
                    <label for="due_date" class="form-label">Due Date</label>
                    <input type="date" id="due_date" name="due_date" class="form-control" placeholder="Select due date" required>
                </div>

                <button type="submit" class="btn btn-blue btn-block btn-lg" style="margin-top: 1.5rem;" id="btnSubmitIssue">
                    Submit
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
